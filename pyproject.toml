[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipette-analysis"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",   # for FastAPI test client
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pa*", "pa_gui*"]

[project.scripts]
pa-server = "pa.__main__:main"
pa-gui    = "pa_gui.__main__:main"
